<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/hocluc-favicon.svg" />
    <link rel="apple-touch-icon" href="/hocluc-favicon.svg" />
    <script src="/hocluc-logo.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1cb0f6" />
    <meta
      name="description"
      content="Học Lực giúp bạn ôn thi V-ACT theo lộ trình rõ ràng, luyện từng kỹ năng và hiểu từng lỗi sai."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Học Lực" />
    <meta property="og:title" content="Học Lực | Ôn V-ACT, vững bước mỗi ngày" />
    <meta
      property="og:description"
      content="Khám phá khóa học, thử câu luyện có lời giải và tìm bước học tiếp theo cùng Học Lực."
    />
    <meta property="og:image" content="https://hocluc.com/landing-v2/assets/hero-vact-exam.webp" />
    <meta property="og:image:alt" content="Mai và Nam cùng luyện bài V-ACT" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Học Lực — Mỗi ngày một chút, tiến xa một bước.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const path = window.location.pathname
        const isAdminSurface = path === '/management/login' || path.startsWith('/admin/')
        let theme = 'light'
        try {
          if (isAdminSurface && window.localStorage.getItem('hocluc.theme') === 'dark') {
            theme = 'dark'
          }
        } catch {
          // The Admin ThemeProvider handles storage failures after mount.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
