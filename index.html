<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/hocluc-favicon.svg" />
    <link rel="apple-touch-icon" href="/hocluc-favicon.svg" />
    <script src="/hocluc-logo.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1cb0f6" />
    <meta
      name="description"
      content="Học Lực giúp bạn ôn thi V-ACT theo lộ trình rõ ràng, luyện từng kỹ năng và hiểu từng lỗi sai."
    />
    <title>Học Lực — Mỗi ngày một chút, tiến xa một bước.</title>
  </head>
  <body class="dark:bg-app-bg">
    <div id="root"></div>
    <script>
      (() => {
        const path = window.location.pathname
        const isRoleSurface =
          path === '/management/login' || /^\/(admin|staff|manager|mentor|teacher)\//.test(path)
        let theme = 'light'
        try {
          if (isRoleSurface && window.localStorage.getItem('hocluc.theme') === 'dark') {
            theme = 'dark'
          }
        } catch {
          // The role ThemeProvider handles storage failures after mount.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
